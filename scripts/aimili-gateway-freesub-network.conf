[Service]
# The Gateway itself uses loopback for its control-plane integrations. Its
# single managed freesub sing-box child needs direct outbound access to the
# dynamically changing candidate addresses and two HTTPS probe endpoints.
IPAddressDeny=
IPAddressAllow=0.0.0.0/0
IPAddressAllow=::/0
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
